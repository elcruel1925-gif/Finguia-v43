name: Compilar Finguia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Descomprimir Finguia
        run: |
          unzip -q Finguia_v43_Android.zip
          cd Finguia_v43_Android
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > gradle.properties
          gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Finguia-v43-APK
          path: Finguia_v43_Android/app/build/outputs/apk/debug/app-debug.apk
