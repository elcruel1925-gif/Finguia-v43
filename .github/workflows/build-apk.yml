name: Compilar Finguia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Descomprimir Finguia
        run: |
          unzip -q Finguia_v43_Android.zip
          cd Finguia_v43_Android
          printf "android.useAndroidX=true\n" >> gradle.properties

      - name: Preparar firma Release
        env:
          KEYSTORE_BASE64: ${{ secrets.FINGUIA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > Finguia_v43_Android/finguia-release.jks
          cat > Finguia_v43_Android/keystore.properties <<EOF
          storeFile=finguia-release.jks
          storePassword=${{ secrets.FINGUIA_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.FINGUIA_KEY_ALIAS }}
          keyPassword=${{ secrets.FINGUIA_KEY_PASSWORD }}
          EOF

      - name: Configurar firma en Gradle
        run: |
          python3 - <<'PY'
          p = "Finguia_v43_Android/app/build.gradle"
          s = open(p).read()
          signing = """
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          android.signingConfigs {
              release {
                  storeFile file(keystoreProperties['storeFile'])
                  storePassword keystoreProperties['storePassword']
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
              }
          }

          """
          s = s.replace("android {", signing + "android {", 1)
          s = s.replace(
              "defaultConfig {",
              "signingConfigs { release signingConfig signingConfigs.release }\n    defaultConfig {",
              1
          )
          s = s.replace(
              "targetSdk 35; versionCode 43; versionName '4.3' }",
              "targetSdk 35; versionCode 43; versionName '4.3'\n        signingConfig signingConfigs.release }",
              1
          )
          open(p, "w").write(s)
          PY

      - name: Compilar APK Release
        run: |
          cd Finguia_v43_Android
          gradle assembleRelease --no-daemon

      - name: Guardar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Finguia-v43-Release
          path: Finguia_v43_Android/app/build/outputs/apk/release/app-release.apk
