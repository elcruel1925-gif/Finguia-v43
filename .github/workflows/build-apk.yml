name: Compilar Finguia APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Descomprimir Finguia
        run: |
          unzip -q Finguia_v43_Android.zip
          cd Finguia_v43_Android
          printf "android.useAndroidX=true\n" >> gradle.properties

      - name: Preparar firma Release
        env:
          KEYSTORE_BASE64: ${{ secrets.FINGUIA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FINGUIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINGUIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FINGUIA_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > Finguia_v43_Android/finguia-release.jks
          cat > Finguia_v43_Android/keystore.properties <<EOF
          storeFile=finguia-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configurar firma en Gradle
        run: |
          cat > Finguia_v43_Android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          android {
              namespace 'com.finguia.app'
              compileSdk 36

              signingConfigs {
                  release {
                      storeFile file("../" + keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

              defaultConfig {
                  applicationId 'com.finguia.app'
                  minSdk 23
                  targetSdk 36
                  versionCode 44
                  versionName '4.4'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }

          kotlin { jvmToolchain(17) }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      - name: Compilar APK Release
        run: |
          cd Finguia_v43_Android
                   gradle assembleRelease bundleRelease --no-daemon

      - name: Guardar APK y AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: Finguia-v43-Release
          path: |
            Finguia_v43_Android/app/build/outputs/apk/release/app-release.apk
            Finguia_v43_Android/app/build/outputs/bundle/release/app-release.aab
